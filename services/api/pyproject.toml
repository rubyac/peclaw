[project]
name = "peclaw-api"
version = "0.1.0"
description = "Industry Intelligence + PE AI Workbench API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=5.2,<7",
  "boto3>=1.36,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "spacy>=3.8,<3.9",
  "spacy-pkuseg>=1,<2",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "zh-core-web-md",
  "httpx>=0.28,<1",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "reportlab>=4,<5",
]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
zh-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_md-3.8.0/zh_core_web_md-3.8.0-py3-none-any.whl" }
